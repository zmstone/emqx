name: Fast-forward release branch from dev branch

concurrency:
  group: sync-dev-to-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron:  '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-forward:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        version:
          - "58"
          - "59"
          - "510"
          - "60"
          - "61"
          - "62"
          - "63"

    env:
      DEV_BRANCH: dev-${{ matrix.version }}
      RELEASE_BRANCH: release-${{ matrix.version }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTH_APP_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}

      - name: Configure git user
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check that the dev branch exists
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "${DEV_BRANCH}" >/dev/null; then
            echo "::notice::origin/${DEV_BRANCH} does not exist; skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Fast-forward release branch
        if: env.SKIP != '1'
        run: ./scripts/ff-release-from-dev.sh "${{ matrix.version }}"

      - name: Send notification to #emqx-devs
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # #emqx-devs channel id; matches what the local notify scripts use.
          SLACK_CHANNEL_ID: C03JJJDM2ES
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "SLACK_BOT_TOKEN is unset; skipping alert."
            exit 0
          fi
          if [ "${NOT_FAST_FORWARD:-0}" = "1" ]; then
            REASON=":x: ${RELEASE_BRANCH} has diverged from ${DEV_BRANCH}; rebase ${DEV_BRANCH} on top of ${RELEASE_BRANCH} (or reset ${DEV_BRANCH} to a descendant of ${RELEASE_BRANCH}) before the next run."
          elif [ "${BRANCH_PROTECTION_DENIED:-0}" = "1" ]; then
            REASON=":x: ${RELEASE_BRANCH} push rejected by branch protection. Add the bot identity (AUTH_APP_ID) as a bypass principal on the ${RELEASE_BRANCH} branch protection rule."
          else
            REASON=":x: Automatic fast-forward of ${RELEASE_BRANCH} from ${DEV_BRANCH} failed."
          fi
          text="${REASON} See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$text" \
                '{channel: $channel, text: $text}' > payload.json
          curl -s https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json | jq -e '.ok' >/dev/null
