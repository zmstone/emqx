[package]
name = "emqx_nifmq"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "emqx_nifmq"
crate-type = ["cdylib"]

[dependencies]
rustler = "=0.37.0"
libc = "=0.2.182"
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
